name: Build WFM (Windows EXE)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (mingw-w64 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            make

      - name: Build with make
        run: make -j4 CC=gcc RC=windres

      - name: Verify output
        run: |
          if [ ! -f wfm.exe ]; then echo "wfm.exe not found - build failed"; exit 1; fi
          ls -la wfm.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfm-exe
          path: |
            wfm.exe
            libcdio.dll

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wfm.exe
            libcdio.dll

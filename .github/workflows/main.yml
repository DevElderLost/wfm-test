name: Build WFM (Windows EXE)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache w64devkit
        id: cache-w64devkit
        uses: actions/cache@v4
        with:
          path: C:\w64devkit
          key: w64devkit-2.0.0

      - name: Download & extract w64devkit
        if: steps.cache-w64devkit.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/skeeto/w64devkit/releases/latest/download/w64devkit-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile w64devkit.zip
          Expand-Archive -Path w64devkit.zip -DestinationPath C:\ -Force

      - name: Build with make
        shell: cmd
        run: |
          set PATH=C:\w64devkit\bin;%PATH%
          make -j8

      - name: Verify output
        shell: pwsh
        run: |
          if (!(Test-Path wfm.exe)) { throw "wfm.exe not found - build failed" }
          Get-Item wfm.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wfm-exe
          path: |
            wfm.exe
            libcdio.dll

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wfm.exe
            libcdio.dll
